[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atongmu-perception"
version = "0.1.0"
description = "阿童木课题视觉感知模块：YOLO26 检测 + RGB-D/激光三维定位"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21",
    "opencv-python>=4.5",
    "pyyaml>=5.4",
    "ultralytics>=8.3",
]

[tool.setuptools.packages.find]
include = ["atongmu_perception*"]
