/**:
  ros__parameters:
    use_sim_time: true
map_server:
  ros__parameters:
    yaml_filename: /home/admin/jetbot-warehouse/map_prior_20261023_01/map.yaml
amcl:
  ros__parameters:
    base_frame_id: chassis
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /jetbot/scan
    robot_model_type: nav2_amcl::OmniMotionModel
    min_particles: 500
    max_particles: 1500
    alpha1: 0.005
    alpha2: 0.005
    alpha3: 0.005
    alpha4: 0.005
    alpha5: 0.005
    laser_model_type: likelihood_field
    laser_max_range: 20.0
    laser_min_range: 0.15
    max_beams: 90
    update_min_d: 0.05
    update_min_a: 0.10
    transform_tolerance: 0.5
    tf_broadcast: true
    do_beamskip: false
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 6.0, z: 0.0, yaw: 0.0}
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.2
      use_astar: true
      allow_unknown: false
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /jetbot/odom
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.30
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.37
      max_vel_y: 0.0
      max_vel_theta: 0.60
      min_speed_xy: 0.0
      max_speed_xy: 0.37
      min_speed_theta: 0.0
      acc_lim_x: 0.40
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.40
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      stateful: true
      forward_prune_distance: 1.0
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.20
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: chassis
    odom_topic: /jetbot/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names: [nav2_compute_path_to_pose_action_bt_node, nav2_compute_path_through_poses_action_bt_node, nav2_remove_passed_goals_action_bt_node, nav2_follow_path_action_bt_node, nav2_rate_controller_bt_node, nav2_pipeline_sequence_bt_node]
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: chassis
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 5.0
      robot_radius: 0.16
      footprint_padding: 0.01
      transform_tolerance: 0.3
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /jetbot/scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 0.40
          obstacle_max_range: 8.0
          obstacle_min_range: 0.15
          raytrace_max_range: 10.0
          raytrace_min_range: 0.15
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 5.0
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: chassis
      resolution: 0.05
      update_frequency: 2.0
      publish_frequency: 1.0
      always_send_full_costmap: true
      robot_radius: 0.16
      footprint_padding: 0.01
      transform_tolerance: 0.5
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /jetbot/scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 0.40
          obstacle_max_range: 8.0
          obstacle_min_range: 0.15
          raytrace_max_range: 10.0
          raytrace_min_range: 0.15
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 5.0
jetbot_scan:
  ros__parameters:
    target_frame: chassis
    transform_tolerance: 0.15
    min_height: 0.03
    max_height: 0.40
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.017453292519943295
    scan_time: 0.12
    range_min: 0.15
    range_max: 20.0
    use_inf: true
jetbot_nav_lifecycle:
  ros__parameters:
    autostart: true
    node_names: [map_server, amcl, planner_server, controller_server, bt_navigator]
    bond_timeout: 10.0
