# 云电脑（Isaac Sim + ROS2 Humble）上的感知参数。
# 主题名、坐标系名需要和场景组最终确定的名字对齐后再改。

camera:
  fx: 554.26          # 会被 /camera/color/camera_info 覆盖
  fy: 554.26
  cx: 320.0
  cy: 240.0
  width: 640
  height: 480
  depth_scale: 1.0
  depth_min: 0.05
  depth_max: 10.0

extrinsics:
  # use_tf_extrinsics=true 时以下手工值会被 TF 覆盖，保留作为离线调试用
  camera_position: [0.08, 0.0, 0.32]
  camera_pitch_deg: 0.0
  camera_yaw_deg: 0.0
  camera_roll_deg: 0.0
  lidar_position: [0.0, 0.0, 0.20]
  lidar_yaw_deg: 0.0
  lidar_pitch_deg: 0.0

detector:
  weights: weights/obstacles_best.pt
  device: cuda:0
  imgsz: 640
  conf: 0.35
  iou: 0.5
  half: false
  max_det: 100
  # 与训练 data.yaml 的 names 顺序一致（8 类障碍物）
  classes:
    - shelf
    - wall
    - box
    - pallet
    - barrier
    - cart
    - sign
    - person

localizer:
  shrink: 0.25
  depth_percentile: 20
  min_valid_pixels: 8
  max_range: 12.0
  use_ground_plane_fallback: true
  ground_plane_pixel: bottom_center

fusion:
  enabled: true
  bbox_margin_px: 12
  min_points: 3
  depth_window_ratio: 0.35
  max_range: 12.0
  scan_angle_offset_deg: 0.0
